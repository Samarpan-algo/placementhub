server:
  port: ${PORT:8080}   # Render sets PORT
  tomcat:
    # Keep reading an oversized upload up to this size, so the browser gets our 400 instead of a dropped connection
    max-swallow-size: 50MB

spring:
  application:
    name: placementhub

  # Local dev: also read the repo root's .env as if its lines were properties. There are two paths because
  # the app may start from backend/ or from the repo root. "optional:" = fine if missing (CI, Render).
  # Real environment variables always win over this file.
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]

  # Values come from environment variables or .env; the part after ":" is the local dev default.
  # KEEP IN SYNC: the defaults (DB name, user, password, port) must match .env.example in the repo root.
  # (Docker Compose uses POSTGRES_* from .env; the backend uses DB_*, so these defaults still apply.)
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/placementhub}
    username: ${DB_USERNAME:placementhub}
    password: ${DB_PASSWORD:placementhub_dev}
    hikari:
      connection-timeout: 5000   # ms; fail fast when the DB is down (default is 30s)

  # Resume uploads. The whole request may be a little over 2 MB, because of the multipart headers.
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

  jpa:
    hibernate:
      ddl-auto: validate    # Flyway owns the schema; Hibernate only checks entities match it
    open-in-view: false     # no lazy-loading DB queries during web response rendering

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100  # larger ?size= values are capped, not rejected

app:
  jwt:
    # Empty -> JwtConfig uses a DEV-ONLY secret and logs a loud WARNING. Production MUST set JWT_SECRET
    # (at least 32 bytes / 256 bits, e.g. `openssl rand -base64 48`). See docs/decisions.md.
    secret: ${JWT_SECRET:}
    expiry: ${JWT_EXPIRY:PT2H}   # ISO-8601 duration; no refresh tokens in v1
    issuer: placementhub

  cors:
    # Comma-separated browser origins allowed to call the API (the deployed frontend URL in Milestone 12).
    # Local dev uses the Vite proxy (same origin), so the default only matters if you skip the proxy.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  resume:
    storage: ${RESUME_STORAGE:supabase}   # "supabase", or "fake" (in memory, used by the test profile)
    signed-url-ttl: PT5M
    supabase:
      # Backend only. The secret key can read and delete every file: never send it to the frontend or logs.
      url: ${SUPABASE_URL:}
      secret-key: ${SUPABASE_SECRET_KEY:}
      bucket: ${SUPABASE_RESUME_BUCKET:}
