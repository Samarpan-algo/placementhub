spring:
  application:
    name: placementhub

  # Values come from environment variables; the part after ":" is the local dev default.
  # KEEP IN SYNC: the defaults (DB name, user, password, port) must match .env.example in the repo root.
  # Spring Boot does NOT read .env — only Docker Compose does.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/placementhub}
    username: ${DB_USERNAME:placementhub}
    password: ${DB_PASSWORD:placementhub_dev}
    hikari:
      connection-timeout: 5000   # ms; fail fast when the DB is down (default is 30s)

  jpa:
    hibernate:
      ddl-auto: validate    # Flyway owns the schema; Hibernate only checks entities match it
    open-in-view: false     # no lazy-loading DB queries during web response rendering

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100  # larger ?size= values are capped, not rejected

app:
  jwt:
    # Empty -> JwtConfig uses a DEV-ONLY secret and logs a loud WARNING. Production MUST set JWT_SECRET
    # (at least 32 bytes / 256 bits, e.g. `openssl rand -base64 48`). See docs/decisions.md.
    secret: ${JWT_SECRET:}
    expiry: ${JWT_EXPIRY:PT2H}   # ISO-8601 duration; no refresh tokens in v1
    issuer: placementhub

  cors:
    # Comma-separated browser origins allowed to call the API (the deployed frontend URL in Milestone 12).
    # Local dev uses the Vite proxy (same origin), so the default only matters if you skip the proxy.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
