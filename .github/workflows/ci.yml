name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    # The repository tests need real PostgreSQL (native SQL, JSONB), so CI starts one.
    # The "test" profile expects exactly this database, user and password. No secrets are needed:
    # the test profile uses the fake resume storage, so CI never calls Supabase.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: placementhub_test
          POSTGRES_USER: placementhub
          POSTGRES_PASSWORD: placementhub_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U placementhub -d placementhub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run tests
        working-directory: backend
        run: ./mvnw -B test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
